services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TUNNELHUB_LISTEN: 0.0.0.0:8080
      TUNNELHUB_DATABASE_URL: sqlite:///data/tunnelhub.db
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TUNNELHUB_UI_HOST: ${TUNNELHUB_UI_HOST:-localhost}
      NGINX_ENVSUBST_FILTER: ^TUNNELHUB_UI_HOST$
    depends_on:
      - server
    ports:
      - "127.0.0.1:${TUNNELHUB_PORT:-8088}:80"
