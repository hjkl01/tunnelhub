services:
  tunnelhub:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TUNNELHUB_LISTEN: 127.0.0.1:8081
      TUNNELHUB_CADDY_ENABLED: ${TUNNELHUB_CADDY_ENABLED:-true}
      TUNNELHUB_CADDY_LISTEN: 0.0.0.0:8080
      TUNNELHUB_CADDY_BIN: /usr/local/bin/caddy
      TUNNELHUB_CADDY_CONFIG: /data/Caddyfile
      TUNNELHUB_DATABASE_URL: sqlite:///data/tunnelhub.db
      TUNNELHUB_COOKIE_SECURE: ${TUNNELHUB_COOKIE_SECURE:-true}
      TUNNELHUB_UI_HOST: ${TUNNELHUB_UI_HOST:-localhost}
    volumes:
      - ./data/tunnelhub_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${TUNNELHUB_PORT:-8088}:8080"
